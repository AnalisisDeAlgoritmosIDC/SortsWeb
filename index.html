<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualización de algoritmos mediante animación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EEF1F7;
    --ink: #0F1A33;
    --bar: #A9B5D3;
    --cmp: #FF4B5C;
    --write: #2A45F5;
    --sorted: #12A38A;
    --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0C1226;
      --ink: #EAF0FF;
      --bar: #2E3D6B;
      --cmp: #FF6B7A;
      --write: #7088FF;
      --sorted: #2BD3B4;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0C1226;
    --ink: #EAF0FF;
    --bar: #2E3D6B;
    --cmp: #FF6B7A;
    --write: #7088FF;
    --sorted: #2BD3B4;
  }

  html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }

  .cover {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 32px;
    max-width: 1500px;
    margin: 0 auto;
    padding: clamp(24px, 5vw, 72px);
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.7rem, min(8vw, 14vh), 7.5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 96;
  }
  h1 span { display: block; }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: clamp(2px, 0.45vw, 6px);
    height: clamp(150px, 36vh, 380px);
  }
  .bars i {
    flex: 1;
    display: block;
    border-radius: 5px 5px 0 0;
    transform-origin: bottom;
    animation: subir 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: calc(var(--i) * 22ms);
  }
  @keyframes subir { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .bars i { animation: none; }
  }
</style>
</head>
<body>
<main class="cover">
  <h1>
    <span>Visualización</span>
    <span>de algoritmos</span>
    <span>mediante animación</span>
  </h1>
  <div class="bars" id="bars" aria-hidden="true"></div>
</main>

<script>
  // Ilustración fija: a la izquierda las barras están revueltas y hacia la derecha quedan en orden.
  (function () {
    var n = 32, caja = document.getElementById("bars"), seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    for (var i = 0; i < n; i++) {
      var t = i / (n - 1);
      var ordenada = i >= n - 8;
      var h = 0.12 + 0.88 * t + (ordenada ? 0 : (rnd() - 0.5) * 1.1 * Math.pow(1 - t, 1.3));
      h = Math.max(0.08, Math.min(1, h));
      var color = ordenada ? "--sorted" : (i === n - 10 ? "--cmp" : (i === n - 9 ? "--write" : "--bar"));
      var b = document.createElement("i");
      b.style.height = (h * 100).toFixed(1) + "%";
      b.style.background = "var(" + color + ")";
      b.style.setProperty("--i", i);
      caja.appendChild(b);
    }
  })();
</script>
</body>
</html>
